<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · HostBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { display: ['Space Grotesk', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
          colors: {
            surface: { 0: '#0a0a0f', 1: '#0f1018', 2: '#16171f', 3: '#1e1f2a' },
            accent: { DEFAULT: '#22d3ee', dim: '#0e7490', glow: 'rgba(34,211,238,0.12)' },
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/bold/style.css" />
  <style>
    body { background: #0a0a0f; }
    .card { background: #0f1018; border: 1px solid rgba(255,255,255,0.06); border-radius: 1rem; }
    .btn-accent { background: #22d3ee; color: #0a0a0f; }
    .btn-accent:hover { background: #67e8f9; }
    .btn-accent:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-ghost { border: 1px solid rgba(255,255,255,0.1); color: #d1d5db; }
    .btn-ghost:hover { background: rgba(255,255,255,0.05); }
    .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 50; }
  </style>
</head>
<body class="text-gray-300 font-display antialiased min-h-screen">

  <div class="flex items-center justify-center min-h-screen px-4">
    <div class="card w-full max-w-md p-8">
      <div class="flex items-center gap-2.5 mb-6">
        <span class="w-8 h-8 rounded-lg bg-accent/15 border border-accent/25 flex items-center justify-center">
          <i class="ph-bold ph-terminal text-accent text-sm"></i>
        </span>
        <a href="/" class="text-white font-semibold text-lg tracking-tight">HostBot</a>
      </div>

      <!-- LOGIN FORM -->
      <div id="auth-login">
        <h1 class="text-2xl font-bold text-white mb-1">Sign in</h1>
        <p class="text-sm text-gray-500 mb-6">Welcome back. Log in to manage your bots.</p>

        <label class="block text-xs text-gray-400 mb-1.5" for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com"
          class="w-full bg-surface-2 border border-white/10 rounded-lg px-4 py-3 text-white font-mono mb-3 focus:outline-none focus:border-accent/60 transition-colors" />

        <label class="block text-xs text-gray-400 mb-1.5" for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••"
          class="w-full bg-surface-2 border border-white/10 rounded-lg px-4 py-3 text-white font-mono mb-3 focus:outline-none focus:border-accent/60 transition-colors" />

        <label class="flex items-center gap-2 text-xs text-gray-400 mb-4 select-none cursor-pointer">
          <input id="remember" type="checkbox" checked class="accent-cyan-400 w-4 h-4 rounded" />
          Remember me
        </label>

        <button id="login-btn" class="btn-accent w-full mt-2 py-3 rounded-lg font-semibold text-sm transition-all active:scale-[0.98]">
          Sign in
        </button>

        <div class="flex items-center gap-3 my-5">
          <span class="flex-1 h-px bg-white/10"></span>
          <span class="text-xs text-gray-500">or continue with</span>
          <span class="flex-1 h-px bg-white/10"></span>
        </div>

        <div class="grid grid-cols-1 gap-3">
          <button id="github-btn" class="btn-ghost py-3 rounded-lg font-semibold text-sm inline-flex items-center justify-center gap-2 transition-all active:scale-[0.98]">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
            GitHub
          </button>
        </div>

        <p class="text-xs text-gray-500 text-center mt-5">
          No account? <button id="go-register" class="text-accent font-semibold hover:underline">Create one</button>
        </p>
        <p id="login-error" class="hidden mt-4 text-center text-sm text-red-400"></p>
      </div>

      <!-- REGISTER FORM -->
      <div id="auth-register" class="hidden">
        <h1 class="text-2xl font-bold text-white mb-1">Create account</h1>
        <p class="text-sm text-gray-500 mb-6">Register to start hosting your bots.</p>

        <label class="block text-xs text-gray-400 mb-1.5" for="reg-email">Email</label>
        <input id="reg-email" type="email" autocomplete="email" placeholder="you@example.com"
          class="w-full bg-surface-2 border border-white/10 rounded-lg px-4 py-3 text-white font-mono mb-3 focus:outline-none focus:border-accent/60 transition-colors" />

        <label class="block text-xs text-gray-400 mb-1.5" for="reg-password">Password</label>
        <input id="reg-password" type="password" autocomplete="new-password" placeholder="Min 6 characters"
          class="w-full bg-surface-2 border border-white/10 rounded-lg px-4 py-3 text-white font-mono mb-3 focus:outline-none focus:border-accent/60 transition-colors" />

        <label class="block text-xs text-gray-400 mb-1.5" for="reg-confirm">Confirm password</label>
        <input id="reg-confirm" type="password" autocomplete="new-password" placeholder="••••••••"
          class="w-full bg-surface-2 border border-white/10 rounded-lg px-4 py-3 text-white font-mono mb-3 focus:outline-none focus:border-accent/60 transition-colors" />

        <label class="flex items-center gap-2 text-xs text-gray-400 mb-4 select-none cursor-pointer">
          <input id="reg-remember" type="checkbox" checked class="accent-cyan-400 w-4 h-4 rounded" />
          Remember me
        </label>

        <button id="register-btn" class="btn-accent w-full mt-2 py-3 rounded-lg font-semibold text-sm transition-all active:scale-[0.98]">
          Create account
        </button>

        <p class="text-xs text-gray-500 text-center mt-5">
          Already have an account? <button id="go-login" class="text-accent font-semibold hover:underline">Sign in</button>
        </p>
        <p id="register-error" class="hidden mt-4 text-center text-sm text-red-400"></p>
      </div>

      <a href="/" class="btn-ghost w-full mt-3 py-3 rounded-lg font-semibold text-sm transition-all active:scale-[0.98] inline-flex items-center justify-center gap-2">
        <i class="ph-bold ph-arrow-left text-base"></i> Back to Home
      </a>
    </div>
  </div>

  <div id="toast" class="toast px-5 py-3 rounded-lg text-sm font-medium shadow-lg hidden"></div>

  <script>
    const $ = (s) => document.querySelector(s);

    // ---- Token storage helpers (remember-me aware) ----
    const KEY = 'hb_token';
    const KEY_RM = 'hb_remember';

    function saveToken(token, remember) {
      localStorage.setItem(KEY, token);
      localStorage.setItem(KEY_RM, remember ? '1' : '0');
      if (remember) {
        localStorage.setItem(KEY, token);
        sessionStorage.removeItem(KEY);
      } else {
        sessionStorage.setItem(KEY, token);
        localStorage.removeItem(KEY);
      }
    }

    function getToken() {
      return localStorage.getItem(KEY) || sessionStorage.getItem(KEY);
    }

    function clearToken() {
      localStorage.removeItem(KEY);
      sessionStorage.removeItem(KEY);
      localStorage.removeItem(KEY_RM);
    }

    function toast(msg, ok = true) {
      const t = $('#toast');
      t.textContent = msg;
      t.className = 'toast px-5 py-3 rounded-lg text-sm font-medium shadow-lg ' +
        (ok ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white');
      t.classList.remove('hidden');
      clearTimeout(t._h);
      t._h = setTimeout(() => t.classList.add('hidden'), 3000);
    }

    function api(path, opts = {}) {
      const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
      const token = getToken();
      if (token) headers['Authorization'] = 'Bearer ' + token;
      return fetch(path, Object.assign({}, opts, { headers })).then(async r => {
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || 'Request failed');
        return data;
      });
    }

    // ---- view switching ----
    function showAuth(which) {
      $('#auth-login').classList.toggle('hidden', which !== 'login');
      $('#auth-register').classList.toggle('hidden', which !== 'register');
      $('#login-error').classList.add('hidden');
      $('#register-error').classList.add('hidden');
    }

    function rememberVal() {
      return $('#remember').checked ? true : false;
    }

    async function login() {
      const email = $('#email').value.trim();
      const password = $('#password').value;
      const err = $('#login-error');
      err.classList.add('hidden');
      if (!email || !password) { err.textContent = 'Enter your email and password.'; err.classList.remove('hidden'); return; }
      const btn = $('#login-btn'); btn.disabled = true;
      try {
        const d = await api('/api/login', { method: 'POST', body: JSON.stringify({ email, password, remember: rememberVal() }) });
        saveToken(d.token, rememberVal());
        finishAuth();
      } catch (e) {
        err.textContent = e.message; err.classList.remove('hidden');
      } finally { btn.disabled = false; }
    }

    async function register() {
      const email = $('#reg-email').value.trim();
      const password = $('#reg-password').value;
      const confirm = $('#reg-confirm').value;
      const err = $('#register-error');
      err.classList.add('hidden');
      if (!email) { err.textContent = 'Enter your email.'; err.classList.remove('hidden'); return; }
      if (password.length < 6) { err.textContent = 'Password must be at least 6 characters.'; err.classList.remove('hidden'); return; }
      if (password !== confirm) { err.textContent = 'Passwords do not match.'; err.classList.remove('hidden'); return; }
      const btn = $('#register-btn'); btn.disabled = true;
      try {
        const d = await api('/api/register', { method: 'POST', body: JSON.stringify({ email, password, confirm_password: confirm, remember: $('#reg-remember').checked ? true : false }) });
        saveToken(d.token, $('#reg-remember').checked ? true : false);
        toast('Account created. Welcome!');
        finishAuth();
      } catch (e) {
        err.textContent = e.message; err.classList.remove('hidden');
      } finally { btn.disabled = false; }
    }

    function githubLogin() {
      window.location.href = '/auth/github';
    }

    // ---- GitHub OAuth callback (we return here from the server) ----
    function handleOAuthResult() {
      const params = new URLSearchParams(window.location.search);
      const auth = params.get('auth');
      if (auth === 'error') { $('#login-error').textContent = 'GitHub sign-in failed.'; $('#login-error').classList.remove('hidden'); return; }
      if (auth === 'cancel') { $('#login-error').textContent = 'GitHub sign-in was cancelled.'; $('#login-error').classList.remove('hidden'); return; }
      if (auth === 'success') {
        const token = params.get('token');
        if (token) saveToken(token, true);
        const clean = window.location.pathname;
        window.history.replaceState({}, '', clean);
        toast('Signed in with GitHub');
        finishAuth();
      }
    }

    function finishAuth() {
      // Verify the token against /api/me, then go to the dashboard.
      api('/api/me').then(() => {
        window.location.href = '/dashboard';
      }).catch(() => {
        clearToken();
        showAuth('login');
        $('#login-error').textContent = 'Signed in but the token could not be validated.';
        $('#login-error').classList.remove('hidden');
      });
    }

    $('#login-btn').onclick = login;
    $('#password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    $('#register-btn').onclick = register;
    $('#reg-confirm').addEventListener('keydown', e => { if (e.key === 'Enter') register(); });
    $('#go-register').onclick = () => showAuth('register');
    $('#go-login').onclick = () => showAuth('login');
    $('#github-btn').onclick = githubLogin;

    // init: if GitHub redirected us back with auth=success, finish login.
    handleOAuthResult();
    // If already signed in (e.g. navigated here manually), bounce to dashboard.
    if (getToken()) { window.location.href = '/dashboard'; }
  </script>
</body>
</html>
